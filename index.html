<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7F4EE">
<title>The PURE Project - Conversation Series Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F4EE; --card: #FCFAF6; --card-alt: #F2EDE3; --text: #211F1C;
    --text-muted: #726E67; --accent: #B87644; --accent-dark: #965C30;
    --sage-bg: rgba(92, 116, 98, 0.14); --amber-bg: rgba(184, 118, 68, 0.14);
    --blue-bg: rgba(74, 111, 165, 0.14); --purple-bg: rgba(123, 94, 167, 0.14);
    --border: #E8E2D5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0 0 110px 0; line-height: 1.5; }
  .app-shell { max-width: 780px; margin: 0 auto; padding: 24px 16px; }
  header { border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 20px; }
  .eyebrow { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 700; display: block; margin-bottom: 4px; }
  h1 { font-family: 'Newsreader', Georgia, serif; font-size: 30px; font-weight: 300; margin: 0 0 6px 0; line-height: 1.15; }
  h1 em { font-style: italic; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin: 0; }
  .header-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .btn { border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 9px 15px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
  @media (max-width: 560px) { .metrics { grid-template-columns: repeat(3, 1fr); } }
  .metric-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 8px; text-align: center; cursor: pointer; }
  .metric-card.active { border-color: var(--accent); background: #FBF7F0; }
  .metric-val { font-family: 'Newsreader', serif; font-size: 24px; color: var(--text); line-height: 1.1; }
  .metric-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-top: 4px; }
  .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .search-input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); font-family: inherit; font-size: 14px; color: var(--text); outline: none; }
  .pill-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .pill-row::-webkit-scrollbar { display: none; }
  .pill { padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--card); color: var(--text-muted); white-space: nowrap; cursor: pointer; }
  .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .contact-list { display: flex; flex-direction: column; gap: 10px; }
  .contact-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px 16px; }
  .contact-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .contact-name { font-weight: 700; font-size: 15.5px; margin: 0; }
  .contact-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .contact-note { font-size: 13px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; }
  .stage-select { font-family: inherit; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; outline: none; }
  .stage-Queued { background: var(--card-alt); color: var(--text-muted); }
  .stage-Invited { background: var(--amber-bg); color: var(--accent-dark); }
  .stage-Agreed { background: var(--sage-bg); color: #3A5240; }
  .stage-Recorded { background: var(--blue-bg); color: #2E4D7B; }
  .stage-Published { background: var(--purple-bg); color: #543B7A; }
  .action-link { background: none; border: 1px solid var(--border); border-radius: 999px; color: var(--text); font-size: 11.5px; font-weight: 600; cursor: pointer; padding: 5px 11px; }
  .action-link.prompt-btn { border-color: var(--accent); color: var(--accent-dark); background: #FBF7F0; }
  .fab-voice { position: fixed; bottom: 24px; right: 22px; width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(135deg, #C6834E, #9E5E2E); color: #fff; border: none; box-shadow: 0 8px 24px rgba(158, 94, 46, 0.38); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 900; }
  .fab-voice.listening { animation: pulse 1.4s infinite; background: #C93B3B; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(201, 59, 59, 0.55); } 70% { box-shadow: 0 0 0 18px rgba(201, 59, 59, 0); } 100% { box-shadow: 0 0 0 0 rgba(201, 59, 59, 0); } }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(33, 31, 28, 0.5); backdrop-filter: blur(3px); display: none; align-items: flex-end; justify-content: center; z-index: 1000; }
  .modal-backdrop.open { display: flex; }
  .modal-sheet { background: var(--card); width: 100%; max-width: 600px; border-radius: 20px 20px 0 0; padding: 24px 20px 34px 20px; max-height: 90vh; overflow-y: auto; }
  .modal-title { font-family: 'Newsreader', serif; font-size: 22px; margin: 0 0 6px 0; }
  .voice-transcript { width: 100%; min-height: 110px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font-family: inherit; font-size: 14px; color: var(--text); margin: 12px 0; resize: vertical; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; z-index: 1200; display: none; max-width: 90%; text-align: center; }
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app-shell">
  <header>
    <span class="eyebrow">The PURE Project &middot; Moving at the Pace of Trust</span>
    <h1>Conversation Series <em>Tracker</em></h1>
    <p class="subtitle">Recorded dialogues with trusted friends &amp; pioneers &mdash; illuminating Born to Connect, Divergent Guides &amp; Mr. Fix Agency</p>
    <div class="header-actions">
      <button class="btn btn-primary" type="button" onclick="openAddModal()">+ Add Person</button>
      <button class="btn btn-accent" type="button" onclick="openPromptModal()">Create Outreach Prompt</button>
      <button class="btn" type="button" onclick="shareTeamUpdate()">Copy Team Update</button>
    </div>
  </header>
  <div class="metrics" id="metricsBar"></div>
  <div class="controls">
    <input type="text" id="searchInput" class="search-input" placeholder="Search friends, locations, projects, or notes..." oninput="render()">
    <div class="pill-row" id="tierPills">
      <button class="pill active" type="button" data-tier="ALL" onclick="setTier('ALL', this)">All Circles</button>
      <button class="pill" type="button" data-tier="Tier 1" onclick="setTier('Tier 1', this)">Tier 1 &middot; Trusted Friends</button>
      <button class="pill" type="button" data-tier="Tier 2" onclick="setTier('Tier 2', this)">Tier 2 &middot; Peer Builders</button>
      <button class="pill" type="button" data-tier="Tier 3" onclick="setTier('Tier 3', this)">Tier 3 &middot; Luminaries</button>
    </div>
  </div>
  <div class="contact-list" id="contactList"></div>
</div>
<script>
const STAGES = ['Queued', 'Invited', 'Agreed', 'Recorded', 'Published'];
const INITIAL_CONTACTS = [
  { id: 1, name: "Carlos Schutz", tier: "Tier 1", stage: "Agreed", role: "Florianopolis, Brazil - Advisor to Philanthropists & UHNWIs", note: "Agreed to record inaugural conversation. Follow up to lock recording date + explore co-advisory client opportunities for The PURE Project & Mr. Fix Agency." },
  { id: 2, name: "Trevor Kamplin", tier: "Tier 1", stage: "Queued", role: "Dear friend - Grounded lived wisdom", note: "Personal presence, life transitions, and human accompaniment." },
  { id: 3, name: "Lucian Tarnowski", tier: "Tier 1", stage: "Queued", role: "Dear friend - United Planet / UP.GAME", note: "Planetary simulation, conscious leadership, and collective flourishing." },
  { id: 4, name: "Liat Cohen", tier: "Tier 1", stage: "Queued", role: "Dear friend & mother", note: "Intuitive presence and reflections on conscious parenting and belonging." },
  { id: 5, name: "Katia Segovia", tier: "Tier 1", stage: "Queued", role: "Dear friend - Relational depth", note: "Warm, authentic personal dialogue." },
  { id: 6, name: "Mel Rubin", tier: "Tier 1", stage: "Queued", role: "Personal coach & close connection", note: "Inner alignment and personal transformation." },
  { id: 7, name: "Cezary Mielczarek", tier: "Tier 1", stage: "Queued", role: "Co-founder - Intaaya", note: "Sanctuary building, spirituality, and regenerative leadership." },
  { id: 8, name: "Lourenco Bustani", tier: "Tier 1", stage: "Queued", role: "Co-founder - Mandalah", note: "Conscious business, cultural wisdom, and human-centered systems." },
  { id: 9, name: "Michel Bachmann", tier: "Tier 1", stage: "Queued", role: "Co-founder - Impact Hub Zurich / deceler8", note: "Slowing down, Theory U, and deep relational listening." },
  { id: 10, name: "Gui Perdrix", tier: "Tier 1", stage: "Queued", role: "Author - The Art of Coliving / Artof.Co", note: "Shared living spaces, belonging, and community architecture." },
  { id: 11, name: "Fabian Pfortmuller", tier: "Tier 1", stage: "Queued", role: "Co-founder - Together Institute / Community Canvas", note: "The craft of gathering people and building spaces without strangers." },
  { id: 12, name: "David Radparvar", tier: "Tier 1", stage: "Queued", role: "Co-founder - Holstee / Reflection.app", note: "Mindful self-inquiry, gratitude, and intentional living." },
  { id: 13, name: "Amisha Ghadiali", tier: "Tier 1", stage: "Queued", role: "Author - Intuition / The Future is Beautiful", note: "Intuitive leadership, wholeness, and conscious community." },
  { id: 14, name: "Carolina Fleissner", tier: "Tier 1", stage: "Queued", role: "Close super-connector", note: "Somatic awareness, conscious communities, and human connection." },
  { id: 15, name: "Burkhard", tier: "Tier 1", stage: "Queued", role: "Close friend & mentor-network anchor", note: "Unique minds and non-traditional human potential." },
  { id: 16, name: "Jeremy & Melanie Roske", tier: "Tier 1", stage: "Queued", role: "Transformational musicians & holistic guides", note: "Authentic expression, voice, and community song." },
  { id: 17, name: "Isaac Koren", tier: "Tier 1", stage: "Queued", role: "Musician - Brothers Koren / Voice Mentor", note: "Unlocking uninhibited human voice and creative courage." },
  { id: 18, name: "Steffen Stauber", tier: "Tier 1", stage: "Queued", role: "Systemic brand strategist", note: "Systemic thinking and authentic narrative." },
  { id: 19, name: "Robert Ian Bonnick", tier: "Tier 1", stage: "Queued", role: "Australia-Indonesia corridor - Strategist & Author", note: "Cross-cultural connection and community ecosystems." },
  { id: 20, name: "Pierre (Zest Ubud)", tier: "Tier 1", stage: "Queued", role: "Bali community anchor - Zest", note: "Building physical hubs where there are no strangers." },
  { id: 21, name: "Karam", tier: "Tier 1", stage: "Queued", role: "Retreat facilitator - Pachamama (Costa Rica)", note: "Contemplative presence and intentional community life." },
  { id: 22, name: "Leina", tier: "Tier 1", stage: "Queued", role: "Ocean retreat facilitator - Japan", note: "Non-verbal attunement and nature connection." },
  { id: 23, name: "Mark Spall", tier: "Tier 1", stage: "Queued", role: "Personal coach & peer", note: "Candid conversation on personal evolution." },
  { id: 24, name: "Gabriela Pados", tier: "Tier 1", stage: "Queued", role: "Reflective mentor", note: "Presence and human accompaniment." },
  { id: 25, name: "Elise Midtun", tier: "Tier 1", stage: "Queued", role: "Close network connection", note: "Holistic family life and conscious living." },
  { id: 26, name: "Jasmine Yao", tier: "Tier 1", stage: "Queued", role: "Creative community & family bridge", note: "Conscious community and family accompaniment." },
  { id: 27, name: "Seth Tabatznik", tier: "Tier 2", stage: "Queued", role: "42 Acres - Musician & Philanthropist", note: "Regenerative land, music, and patronage; Mr. Fix Agency / PURE Project synergy." },
  { id: 28, name: "Chip Conley", tier: "Tier 2", stage: "Queued", role: "Founder - Modern Elder Academy (MEA)", note: "Intergenerational wisdom, elderhood, and lifelong transitions." },
  { id: 29, name: "Rob Holzer", tier: "Tier 2", stage: "Queued", role: "Matter Unlimited / Lineage Project", note: "Purpose-driven brand architecture and mindful youth programs." },
  { id: 30, name: "Alnoor Ladha", tier: "Tier 2", stage: "Queued", role: "Transition Resource Circle - Author", note: "Unlearning, relationality, and post-capitalist philanthropy." },
  { id: 31, name: "Michael Ventura", tier: "Tier 2", stage: "Queued", role: "Author - Applied Empathy / Sub Rosa", note: "Deep listening and applied empathy in leadership." },
  { id: 32, name: "Jason Swamy", tier: "Tier 2", stage: "Queued", role: "Wonderfruit / Further Future", note: "How festivals and temporary cities catalyze lasting human connection." },
  { id: 33, name: "Dakotah Apostolou", tier: "Tier 2", stage: "Queued", role: "Co-founder - Cohere Network", note: "Regenerative villages and shared living spaces." },
  { id: 34, name: "Michael Franti & Spearhead", tier: "Tier 3", stage: "Queued", role: "Soulshine - Musician & Activist", note: "Share inaugural episodes first; music and conscious gathering." },
  { id: 35, name: "Keanu Reeves", tier: "Tier 3", stage: "Queued", role: "Artist & Cultural Icon", note: "Share live series as credibility anchor; deep alignment with authentic humanity." },
  { id: 36, name: "Tomas Bjorkman", tier: "Tier 3", stage: "Queued", role: "Ekskaret Foundation / IDGs", note: "Swedish philanthropist championing inner development." },
  { id: 37, name: "Virgin Unite & The Elders", tier: "Tier 3", stage: "Queued", role: "Global Impact & Peacebuilding", note: "Catalytic global leadership and intergenerational presence." },
  { id: 38, name: "Bayo Akomolafe", tier: "Tier 3", stage: "Queued", role: "The Emergence Network - Philosopher", note: "Slowing down and relational emergence." }
];
let contacts = JSON.parse(localStorage.getItem('pure_series_contacts_v7')) || INITIAL_CONTACTS;
let selectedTier = 'ALL', selectedStage = 'ALL', recognition = null, isListening = false;

function save() { localStorage.setItem('pure_series_contacts_v7', JSON.stringify(contacts)); render(); }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(window._t); window._t = setTimeout(() => { t.style.display = 'none'; }, 3200); }
function setTier(tier, el) { selectedTier = tier; document.querySelectorAll('#tierPills .pill').forEach(p => p.classList.remove('active')); el.classList.add('active'); render(); }
function toggleStageFilter(stage) { selectedStage = (selectedStage === stage) ? 'ALL' : stage; render(); }
function changeStage(id, newStage) { const c = contacts.find(x => x.id === id); if (c) { c.stage = newStage; save(); showToast(c.name + " -> " + newStage); } }
function esc(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  document.getElementById('metricsBar').innerHTML = STAGES.map(st => {
    const n = contacts.filter(c => c.stage === st).length;
    return '<div class="metric-card ' + (selectedStage === st ? 'active' : '') + '" onclick="toggleStageFilter(\'' + st + '\')"><div class="metric-val">' + n + '</div><div class="metric-label">' + st + '</div></div>';
  }).join('');

  const list = contacts.filter(c => (selectedTier === 'ALL' || c.tier === selectedTier) && (selectedStage === 'ALL' || c.stage === selectedStage) && (!q || c.name.toLowerCase().includes(q) || (c.role && c.role.toLowerCase().includes(q)) || (c.note && c.note.toLowerCase().includes(q))));
  const rank = { 'Agreed': 1, 'Invited': 2, 'Recorded': 3, 'Published': 4, 'Queued': 5 };
  list.sort((a, b) => (rank[a.stage] || 9) - (rank[b.stage] || 9));

  const el = document.getElementById('contactList');
  if (!list.length) { el.innerHTML = '<div style="text-align:center;padding:36px;color:var(--text-muted)">No matching contacts found.</div>'; return; }
  el.innerHTML = list.map(c => {
    const opts = STAGES.map(st => '<option value="' + st + '" ' + (c.stage === st ? 'selected' : '') + '>' + st + '</option>').join('');
    return '<div class="contact-card"><div class="contact-top"><div><h3 class="contact-name">' + esc(c.name) + '</h3><div class="contact-meta">' + esc(c.tier) + ' &middot; ' + esc(c.role || '') + '</div></div><select class="stage-select stage-' + c.stage + '" onchange="changeStage(' + c.id + ', this.value)">' + opts + '</select></div>' + (c.note ? '<div class="contact-note">' + esc(c.note) + '</div>' : '') + '<div class="card-actions"><button class="action-link prompt-btn" type="button" onclick="openPromptModal(' + c.id + ')">Create Prompt</button><button class="action-link" type="button" onclick="openEditModal(' + c.id + ')">Edit Details</button></div></div>';
  }).join('');
}

function openPromptModal(id) {
  const s = document.getElementById('promptContactSelect');
  s.innerHTML = contacts.map(c => '<option value="' + c.id + '">' + esc(c.name) + ' (' + esc(c.tier) + ')</option>').join('');
  if (id) s.value = id;
  generatePromptText();
  document.getElementById('promptModal').classList.add('open');
}
function closePromptModal() { document.getElementById('promptModal').classList.remove('open'); }
function generatePromptText() {
  const c = contacts.find(x => x.id === Number(document.getElementById('promptContactSelect').value)) || contacts[0];
  const st = document.getElementById('promptStyleSelect').value, fn = c.name.split(' ')[0];
  let out = '';
  if (st === 'voicenote') out = 'Hey ' + fn + ', thinking of you today. After a quieter chapter of listening and synthesizing here in Bali, I am starting an intimate recorded conversation series with a handful of close friends and pioneers I deeply respect.\n\nNo stiff interview questions - just an authentic dialogue around ' + (c.note ? c.note.toLowerCase().replace(/\.$/, '') : 'creating spaces where people truly belong') + ', and how our worlds intersect with The PURE Project and Born to Connect.\n\nWould you be open to me sending a short note and seeing if you might enjoy sitting down for a recorded conversation soon?';
  else if (st === 'whatsapp') out = 'Hey ' + fn + ' - hope you are flowing well. I am launching an intimate recorded conversation series starting with close friends I deeply trust, exploring human connection and The PURE Project (Born to Connect / Divergent Guides). Would love to invite you to be one of our founding dialogues if that feels fun and aligned. Open to a quick chat soon?';
  else if (st === 'catalyst') out = 'Hey ' + fn + ' - I am placing something very close to my heart in your hands first. We are opening an intimate founding circle for the first six participants in the Born to Connect Community Catalyst Training - blending six live online labs, real-world field practice, and an in-person gathering.\n\nSince you naturally weave people together (' + c.role + '), I would love your eyes on this - either for yourself or anyone in your circle who came to mind: https://borntoconnect.us/invitation\n\nWe move at the pace of trust.';
  else out = 'Draft a warm, unhurried voice note script from Ryan Fix (founder of The PURE Project, Born to Connect, Divergent Guides, and Mr. Fix Agency) to ' + c.name + ' (' + c.role + '). Context: ' + c.note + '. Tone: Editorial minimalism, high trust, zero hype.';
  document.getElementById('promptOutput').value = out;
}
function copyPromptOutput() { navigator.clipboard.writeText(document.getElementById('promptOutput').value).then(() => showToast('Prompt copied!')); }

function openVoiceModal() { document.getElementById('voiceText').value = ''; document.getElementById('voiceModal').classList.add('open'); startSpeech(); }
function closeVoiceModal() { stopSpeech(); document.getElementById('voiceModal').classList.remove('open'); }
function toggleSpeech() { isListening ? stopSpeech() : startSpeech(); }
function startSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { document.getElementById('voiceStatus').textContent = "Speech recognition unavailable - type your update below:"; return; }
  recognition = new SR(); recognition.lang = 'en-US'; recognition.interimResults = true;
  recognition.onstart = () => { isListening = true; document.getElementById('fabVoice').classList.add('listening'); document.getElementById('micToggleBtn').textContent = 'Stop Listening'; document.getElementById('voiceStatus').textContent = 'Listening...'; };
  recognition.onresult = (e) => { let t = ''; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; document.getElementById('voiceText').value = t; };
  recognition.onerror = () => stopSpeech(); recognition.onend = () => stopSpeech(); recognition.start();
}
function stopSpeech() { isListening = false; document.getElementById('fabVoice').classList.remove('listening'); document.getElementById('micToggleBtn').textContent = 'Start Listening'; if (recognition) { try { recognition.stop(); } catch (e) {} } }
function processVoiceCommand() {
  const raw = document.getElementById('voiceText').value.trim(); if (!raw) { closeVoiceModal(); return; }
  const lower = raw.toLowerCase();
  let st = null;
  if (/ (publish|published|live|posted|shared) /.test(' ' + lower + ' ')) st = 'Published';
  else if (/ (record|recorded|filmed|taped) /.test(' ' + lower + ' ')) st = 'Recorded';
  else if (/ (agree|agreed|schedule|scheduled|confirmed|yes) /.test(' ' + lower + ' ')) st = 'Agreed';
  else if (/ (invite|invited|reached out|voice note|messaged|sent) /.test(' ' + lower + ' ')) st = 'Invited';
  else if (/ (queue|queued|reset) /.test(' ' + lower + ' ')) st = 'Queued';
  const m = contacts.filter(c => { const full = c.name.toLowerCase(), first = full.split(' ')[0]; return lower.includes(full) || (first.length > 3 && (' ' + lower + ' ').includes(' ' + first + ' ')); });
  if (m.length) {
    m.forEach(c => { if (st) c.stage = st; if (!st) c.note = (c.note ? c.note + ' | ' : '') + raw; });
    save(); closeVoiceModal(); showToast("Updated " + m.map(x => x.name).join(', ') + (st ? ' -> ' + st : ''));
  } else { showToast('No matching name found - tap + Add Person.'); }
}

function openEditModal(id) { const c = contacts.find(x => x.id === id); if (!c) return; document.getElementById('editModalTitle').textContent = 'Edit Contact'; document.getElementById('editId').value = c.id; document.getElementById('editName').value = c.name; document.getElementById('editTier').value = c.tier; document.getElementById('editStage').value = c.stage; document.getElementById('editRole').value = c.role || ''; document.getElementById('editNote').value = c.note || ''; document.getElementById('editModal').classList.add('open'); }
function openAddModal() { document.getElementById('editModalTitle').textContent = 'Add New Contact'; document.getElementById('editId').value = ''; document.getElementById('editName').value = ''; document.getElementById('editTier').value = 'Tier 1'; document.getElementById('editStage').value = 'Queued'; document.getElementById('editRole').value = ''; document.getElementById('editNote').value = ''; document.getElementById('editModal').classList.add('open'); }
function closeEditModal() { document.getElementById('editModal').classList.remove('open'); }
function saveEdit() {
  const idVal = document.getElementById('editId').value, name = document.getElementById('editName').value.trim(); if (!name) return;
  const d = { name, tier: document.getElementById('editTier').value, stage: document.getElementById('editStage').value, role: document.getElementById('editRole').value.trim(), note: document.getElementById('editNote').value.trim() };
  if (idVal) { const i = contacts.findIndex(x => x.id === Number(idVal)); if (i !== -1) contacts[i] = { ...contacts[i], ...d }; }
  else contacts.unshift({ id: Date.now(), ...d });
  save(); closeEditModal(); showToast("Saved " + name);
}
function shareTeamUpdate() {
  const active = contacts.filter(c => c.stage !== 'Queued');
  const lines = ["The PURE Project - Conversation Series Update", "- Agreed: " + contacts.filter(c => c.stage === 'Agreed').length, "- Invited: " + contacts.filter(c => c.stage === 'Invited').length, "- Recorded: " + contacts.filter(c => c.stage === 'Recorded').length, "- Published: " + contacts.filter(c => c.stage === 'Published').length, "", ...active.map(c => "- " + c.name + " (" + c.stage + "): " + (c.note || c.role))];
  navigator.clipboard.writeText(lines.join('\n')).then(() => showToast('Team summary copied!'));
}
render();
</script>
</body>
